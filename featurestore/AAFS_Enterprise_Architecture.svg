<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="980" viewBox="0 0 1920 980">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#0f2f57"/><stop offset="1" stop-color="#174f7e"/>
    </linearGradient>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#475569}
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.zoneTitle{font:700 20px Arial,sans-serif;fill:#0f172a}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.boxTitle{font:700 18px Arial,sans-serif;fill:#0f172a}
      .body{font:400 15px Arial,sans-serif;fill:#334155}.small{font:400 13px Arial,sans-serif;fill:#475569}
      .chip{fill:#e8f1fb;stroke:#bdd3ea}.chipText{font:600 13px Arial,sans-serif;fill:#174f7e}
      .flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.support{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1920" height="980" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="92" fill="url(#header)"/>
  <text x="70" y="50" font-family="Arial" font-size="30" font-weight="700" fill="#fff">AAFS Metadata Driven Feature Store Architecture</text>
  <text x="70" y="76" font-family="Arial" font-size="15" fill="#dbeafe">PFS historical features and PFUS future scoring features on Azure Databricks</text>

  <!-- Configuration lane -->
  <text x="70" y="135" class="zoneTitle">Configuration and source control</text>
  <rect x="70" y="155" width="1780" height="135" rx="14" class="zone"/>

  <g transform="translate(105,178)">
    <rect width="255" height="88" rx="12" class="box"/>
    <rect x="18" y="19" width="42" height="42" rx="7" fill="#0078d4"/>
    <path d="M28 29l12-7 13 7-13 7zm0 14l12-7 13 7-13 7z" fill="#fff" opacity=".95"/>
    <text x="76" y="38" class="boxTitle">Azure DevOps</text>
    <text x="76" y="61" class="small">Version-controlled repository</text>
  </g>
  <g transform="translate(405,178)">
    <rect width="310" height="88" rx="12" class="box"/>
    <text x="22" y="33" class="boxTitle">Global configuration</text>
    <text x="22" y="57" class="small">PFS / PFUS settings, mappings, connections</text>
  </g>
  <g transform="translate(760,178)">
    <rect width="310" height="88" rx="12" class="box"/>
    <text x="22" y="33" class="boxTitle">Feature configuration</text>
    <text x="22" y="57" class="small">Grain, SQL steps, windows, validations</text>
  </g>
  <g transform="translate(1115,178)">
    <rect width="290" height="88" rx="12" class="box"/>
    <text x="22" y="33" class="boxTitle">Parameterized SQL</text>
    <text x="22" y="57" class="small">Domain and final-table transformations</text>
  </g>
  <g transform="translate(1450,178)">
    <rect width="365" height="88" rx="12" class="box"/>
    <text x="22" y="33" class="boxTitle">Versioned SQL metadata</text>
    <text x="22" y="57" class="small">SQL path and commit ID retained for execution</text>
  </g>

  <!-- Runtime lane -->
  <text x="70" y="340" class="zoneTitle">Scheduled runtime and orchestration</text>
  <rect x="70" y="360" width="1780" height="305" rx="14" class="zone"/>

  <g transform="translate(100,417)">
    <rect width="210" height="170" rx="14" class="box"/>
    <circle cx="105" cy="48" r="31" fill="#334155"/>
    <path d="M84 49c8-13 37-15 48-3 8 9 1 18-9 19l14 17h-17l-15-20h-7v20H84z" fill="#fff"/>
    <text x="105" y="105" text-anchor="middle" class="boxTitle">RageMaker</text>
    <text x="105" y="130" text-anchor="middle" class="body">Enterprise scheduler</text>
    <text x="105" y="151" text-anchor="middle" class="small">Triggers PFS / PFUS runs</text>
  </g>

  <g transform="translate(360,390)">
    <rect width="520" height="225" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="55" cy="46" r="27" fill="#2468a2"/>
    <ellipse cx="50" cy="44" rx="23" ry="15" fill="#b8c8d8"/>
    <text x="47" y="53" font-family="Arial" font-size="24" font-weight="700" fill="#2468a2">R</text>
    <text x="95" y="42" class="boxTitle">AAFS R Runtime</text>
    <text x="95" y="65" class="small">Metadata-driven orchestration layer</text>
    <rect x="28" y="88" width="218" height="43" rx="9" class="chip"/><text x="42" y="114" class="chipText">build_fs_date</text>
    <text x="260" y="113" class="small">Calculate incremental range</text>
    <rect x="28" y="141" width="218" height="43" rx="9" class="chip"/><text x="42" y="167" class="chipText">Configuration resolver</text>
    <text x="260" y="166" class="small">Merge global + feature YAML</text>
    <rect x="28" y="194" width="218" height="43" rx="9" class="chip"/><text x="42" y="220" class="chipText">build_fs</text>
    <text x="260" y="210" class="small">Windowing, concurrency, Jobs API</text>
    <text x="260" y="229" class="small">polling, retry and recovery</text>
  </g>

  <g transform="translate(930,390)">
    <rect width="285" height="225" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5" filter="url(#shadow)"/>
    <g transform="translate(24,24)">
      <path d="M20 0l34 18-34 18L-14 18zM20 18l34 18-34 18-34-18zM20 38l34 18-34 18-34-18z" fill="none" stroke="#ff3621" stroke-width="5"/>
    </g>
    <text x="95" y="49" class="boxTitle">Databricks Job</text>
    <text x="24" y="92" class="body">Jobs API payload</text>
    <text x="24" y="118" class="small">• Processing window</text>
    <text x="24" y="140" class="small">• Table and SQL steps</text>
    <text x="24" y="162" class="small">• Delete/check modes</text>
    <text x="24" y="184" class="small">• Runtime parameters</text>
    <text x="24" y="206" class="small">• Commit/version metadata</text>
  </g>

  <g transform="translate(1265,390)">
    <rect width="270" height="225" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="24" y="40" class="boxTitle">All-purpose compute</text>
    <text x="24" y="65" class="small">Existing single-driver cluster</text>
    <rect x="24" y="88" width="222" height="56" rx="10" fill="#fff" stroke="#bfdbfe"/>
    <text x="40" y="113" class="body">Python control notebook</text>
    <text x="40" y="134" class="small">Lightweight orchestration</text>
    <text x="24" y="172" class="small">Receives payload and submits</text>
    <text x="24" y="194" class="small">SQL statements to warehouse</text>
  </g>

  <g transform="translate(1585,390)">
    <rect width="235" height="225" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" filter="url(#shadow)"/>
    <g transform="translate(25,24)">
      <path d="M20 0l31 16-31 16-31-16zM20 17l31 16-31 16-31-16z" fill="none" stroke="#ff3621" stroke-width="4"/>
    </g>
    <text x="82" y="47" class="boxTitle">SQL Warehouse</text>
    <text x="24" y="94" class="body">Transformation compute</text>
    <text x="24" y="121" class="small">• Conditional SQL</text>
    <text x="24" y="143" class="small">• Partition delete</text>
    <text x="24" y="165" class="small">• Ordered inserts</text>
    <text x="24" y="187" class="small">• Count and PK checks</text>
  </g>

  <!-- Main arrows -->
  <path d="M310 502H350" class="flow"/>
  <path d="M880 502H920" class="flow"/>
  <path d="M1215 502H1255" class="flow"/>
  <path d="M1535 502H1575" class="flow"/>
  <path d="M232 266V305H620V380" class="support"/>
  <path d="M560 266V312H650V380" class="support"/>
  <path d="M915 266V319H680V380" class="support"/>
  <path d="M1260 266V312H1073V380" class="support"/>
  <path d="M1632 266V319H1073V380" class="support"/>

  <!-- Data lane -->
  <text x="70" y="715" class="zoneTitle">Lakehouse storage, governance and consumption</text>
  <rect x="70" y="735" width="1780" height="185" rx="14" class="zone"/>

  <g transform="translate(185,772)">
    <rect width="330" height="108" rx="14" class="box"/>
    <path d="M34 72c7-28 22-44 40-44 16 0 27 11 30 25 17-4 34 7 34 24H34z" fill="#0078d4" opacity=".9"/>
    <text x="155" y="39" class="boxTitle">ADLS Gen2</text>
    <text x="155" y="64" class="body">Partitioned Delta storage</text>
    <text x="155" y="86" class="small">Historical and future feature data</text>
  </g>
  <g transform="translate(590,772)">
    <rect width="330" height="108" rx="14" class="box"/>
    <path d="M35 31l28-14 28 14-28 14zm0 17l28-14 28 14-28 14zm0 17l28-14 28 14-28 14z" fill="none" stroke="#ff3621" stroke-width="4"/>
    <text x="118" y="38" class="boxTitle">Unity Catalog</text>
    <text x="118" y="63" class="body">Governance and access</text>
    <text x="118" y="85" class="small">Registered Delta tables and views</text>
  </g>
  <g transform="translate(995,772)">
    <rect width="335" height="108" rx="14" class="box"/>
    <text x="24" y="36" class="boxTitle">Feature processing layer</text>
    <text x="24" y="62" class="body">Physical Delta tables</text>
    <text x="24" y="86" class="small">aa_smkt_pfs_v3 • domain and final grains</text>
  </g>
  <g transform="translate(1405,772)">
    <rect width="330" height="108" rx="14" class="box"/>
    <text x="24" y="36" class="boxTitle">Serving and consumption</text>
    <text x="24" y="62" class="body">Views in aa_smkt_pfs</text>
    <text x="24" y="86" class="small">Data science, forecasting and ML models</text>
  </g>
  <path d="M1703 615V747H1162V760" class="flow"/>
  <path d="M515 826H580" class="flow"/>
  <path d="M920 826H985" class="flow"/>
  <path d="M1330 826H1395" class="flow"/>

  <text x="70" y="956" class="small">Execution pattern: configuration-driven date windows • controlled parallelism • partition-scoped delete and reload • validation • retry and operational audit</text>
</svg>
